version: v1

# Note: buf discovers all .proto files recursively under protos/,
# so academic/academic.proto is automatically included by the plugins below.
# No separate academic entry is needed — Go output goes to
# ../go/orchestrator/internal/pb/academic/ automatically via source_relative.

plugins:
  - plugin: buf.build/protocolbuffers/go
    out: ../go/orchestrator/internal/pb
    opt:
      - paths=source_relative
  - plugin: buf.build/grpc/go
    out: ../go/orchestrator/internal/pb
    opt:
      - paths=source_relative
  - plugin: buf.build/protocolbuffers/python
    out: ../python/llm-service/llm_service/generated
  - plugin: buf.build/grpc/python
    out: ../python/llm-service/llm_service/generated
